name: Validar Coordinacion

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/coordinacion-operativa
      - feature/analisis-documental-pdf
      - feature/lote-documental-inteligente
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: prueba-ci-sicode
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar Python
        run: python -m compileall -q app migrations

      - name: Validar cadena de migraciones
        run: python -m flask --app run.py db heads

      - name: Validar scripts de despliegue
        run: bash -n scripts/configurar_runtime_analisis_documental.sh

      - name: Validar aplicacion, modelos y plantillas
        run: |
          python - <<'PY'
          from app import create_app, db

          app = create_app()
          with app.app_context():
              db.create_all()
              tablas = set(db.metadata.tables.keys())
              esperadas = {
                  'registros_coordinacion',
                  'pagos_coordinacion',
                  'movimientos_dispositivo',
                  'anexos_coordinacion',
                  'reportes_monitoreo',
                  'analisis_riesgo',
                  'documentos_emitidos',
                  'actividades_coordinacion',
                  'remisiones_coordinacion',
                  'remisiones_expedientes',
                  'analisis_documentales',
                  'segmentos_documentales',
                  'aprendizaje_documental',
                  'patrones_aprendizaje_documental',
                  'accesos_cct',
              }
              faltantes = esperadas - tablas
              assert not faltantes, f'Tablas faltantes: {sorted(faltantes)}'
              assert 'banco' in db.metadata.tables['pagos_coordinacion'].columns

          rutas = [str(regla) for regla in app.url_map.iter_rules()]
          assert '/coordinacion/' in rutas
          assert '/coordinacion/registros' in rutas
          assert '/coordinacion/registrar/<tipo>' in rutas
          assert '/coordinacion/importar' in rutas
          assert '/coordinacion/exportar' in rutas
          assert '/coordinacion/rectificacion-produccion/estado' in rutas
          assert '/coordinacion/rectificacion-produccion/guardar' in rutas
          assert '/coordinacion/monitoreo/masivo' in rutas
          assert '/coordinacion/monitoreo/masivo/estado-sp' in rutas
          assert '/coordinacion/monitoreo/masivo/rectificar' in rutas
          assert '/coordinacion/analisis-documental/' in rutas
          assert '/coordinacion/analisis-documental/<int:analisis_id>' in rutas
          assert '/coordinacion/analisis-documental/<int:analisis_id>/confirmar' in rutas
          assert '/coordinacion/analisis-documental/lotes/analizar' in rutas
          assert '/coordinacion/analisis-documental/lotes/<int:analisis_id>' in rutas
          assert '/coordinacion/analisis-documental/lotes/<int:analisis_id>/segmentos/<int:segmento_id>/confirmar' in rutas
          assert '/coordinacion/analisis-documental/lotes/<int:analisis_id>/segmentos/<int:segmento_id>/descartar' in rutas
          assert '/coordinacion/analisis-documental/lotes/aprendizaje' in rutas
          assert '/pagos/' in rutas
          assert '/pagos/registrar' in rutas
          assert '/pagos/historico' in rutas
          assert '/pagos/sp/<int:expediente_id>' in rutas
          assert '/ca-cct/' in rutas
          assert '/ca-cct/<int:acceso_id>/pdf' in rutas

          plantillas = [
              'coordinacion/inicio.html',
              'coordinacion/formulario.html',
              'coordinacion/anexo_control.html',
              'coordinacion/monitoreo_masivo.html',
              'coordinacion/listado.html',
              'coordinacion/detalle.html',
              'coordinacion/remision_detalle.html',
              'coordinacion/importar.html',
              'analisis_documental/inicio.html',
              'analisis_documental/resultado.html',
              'analisis_documental/lote_resultado.html',
              'pagos/dashboard.html',
              'pagos/registrar.html',
              'pagos/historico.html',
              'control_accesos/inicio.html',
          ]
          for nombre in plantillas:
              app.jinja_env.get_template(nombre)

          print('Validacion de Coordinacion, Pagos y C.A CCT completada correctamente.')
          PY

      - name: Probar Coordinacion, Pagos, C.A CCT y extractores documentales
        run: pytest -q tests/test_rectificacion_produccion_coordinacion.py tests/test_coordinacion_carrusel_ui.py tests/test_monitoreo_anexos.py tests/test_monitoreo_masivo.py tests/test_monitoreo_masivo_sin_fisico.py tests/test_analisis_riesgo_anexos.py tests/test_recepcion_expediente_completo_fecha.py tests/test_pagos_service.py tests/test_control_accesos_cct.py tests/test_analisis_documental_service.py tests/test_lote_documental_service.py tests/test_indice_documental_foliacion_anexos.py

  postgres-anexos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sicode
          POSTGRES_PASSWORD: sicode_ci
          POSTGRES_DB: sicode_coordinacion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sicode -d sicode_coordinacion_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: "postgresql://sicode:sicode_ci@127.0.0.1:5432/sicode_coordinacion_ci"
      SECRET_KEY: prueba-ci-sicode-postgres
      PYTHONPATH: .
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar Python y migraciones
        run: python -m compileall -q app migrations tests

      - name: Aplicar cadena completa de migraciones en PostgreSQL
        run: |
          python -m flask --app run.py db upgrade
          python -m flask --app run.py db current
          python -m flask --app run.py db heads

      - name: Probar Monitoreo y Analisis de riesgo en PostgreSQL
        run: pytest -q tests/test_monitoreo_anexos.py tests/test_monitoreo_masivo.py tests/test_monitoreo_masivo_sin_fisico.py tests/test_analisis_riesgo_anexos.py tests/test_rectificacion_produccion_coordinacion.py tests/test_recepcion_expediente_completo_fecha.py
