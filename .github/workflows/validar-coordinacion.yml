name: Validar Coordinacion

on:
  workflow_dispatch:
  push:
    branches:
      - feature/coordinacion-operativa
      - feature/analisis-documental-pdf
      - feature/lote-documental-inteligente
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: prueba-ci-sicode
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar Python
        run: python -m compileall -q app migrations

      - name: Validar scripts de despliegue
        run: bash -n scripts/configurar_runtime_analisis_documental.sh

      - name: Validar aplicacion, modelos y plantillas
        run: |
          python - <<'PY'
          from app import create_app, db

          app = create_app()
          with app.app_context():
              db.create_all()
              tablas = set(db.metadata.tables.keys())
              esperadas = {
                  'registros_coordinacion',
                  'pagos_coordinacion',
                  'movimientos_dispositivo',
                  'anexos_coordinacion',
                  'reportes_monitoreo',
                  'documentos_emitidos',
                  'actividades_coordinacion',
                  'remisiones_coordinacion',
                  'remisiones_expedientes',
                  'analisis_documentales',
                  'segmentos_documentales',
                  'aprendizaje_documental',
                  'patrones_aprendizaje_documental',
              }
              faltantes = esperadas - tablas
              assert not faltantes, f'Tablas faltantes: {sorted(faltantes)}'

          rutas = [str(regla) for regla in app.url_map.iter_rules()]
          assert '/coordinacion/' in rutas
          assert '/coordinacion/registros' in rutas
          assert '/coordinacion/registrar/<tipo>' in rutas
          assert '/coordinacion/importar' in rutas
          assert '/coordinacion/exportar' in rutas
          assert '/coordinacion/analisis-documental/' in rutas
          assert '/coordinacion/analisis-documental/<int:analisis_id>' in rutas
          assert '/coordinacion/analisis-documental/<int:analisis_id>/confirmar' in rutas
          assert '/coordinacion/analisis-documental/lotes/analizar' in rutas
          assert '/coordinacion/analisis-documental/lotes/<int:analisis_id>' in rutas
          assert '/coordinacion/analisis-documental/lotes/<int:analisis_id>/segmentos/<int:segmento_id>/confirmar' in rutas
          assert '/coordinacion/analisis-documental/lotes/<int:analisis_id>/segmentos/<int:segmento_id>/descartar' in rutas
          assert '/coordinacion/analisis-documental/lotes/aprendizaje' in rutas

          plantillas = [
              'coordinacion/inicio.html',
              'coordinacion/formulario.html',
              'coordinacion/listado.html',
              'coordinacion/detalle.html',
              'coordinacion/remision_detalle.html',
              'coordinacion/importar.html',
              'analisis_documental/inicio.html',
              'analisis_documental/resultado.html',
              'analisis_documental/lote_resultado.html',
          ]
          for nombre in plantillas:
              app.jinja_env.get_template(nombre)

          print('Validacion de Coordinacion completada correctamente.')
          PY

      - name: Probar extractores documentales
        run: pytest -q tests/test_analisis_documental_service.py tests/test_lote_documental_service.py
