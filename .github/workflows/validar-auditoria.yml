name: Validar Auditoria

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest-sqlite:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:////tmp/sicode_auditoria_test.db"
      SECRET_KEY: "ci-sicode-auditoria-segura"
      PYTHONPATH: "."
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar Python
        run: python -m compileall -q app migrations tests

      - name: Ejecutar pruebas SQLite
        run: pytest -q

      - name: Validar cabeza de migraciones
        run: python -m flask --app run.py db heads

  postgres-integracion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sicode_ci
          POSTGRES_PASSWORD: sicode_ci_password
          POSTGRES_DB: sicode_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sicode_ci -d sicode_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: "ci-sicode-postgres-segura"
      PYTHONPATH: "."
      PGPASSWORD: "sicode_ci_password"
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias y cliente PostgreSQL
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Crear base separada para pytest
        run: createdb -h localhost -U sicode_ci sicode_test

      - name: Ejecutar pruebas contra PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg2://sicode_ci:sicode_ci_password@localhost:5432/sicode_test"
        run: pytest -q

      - name: Aplicar cadena completa de migraciones en PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg2://sicode_ci:sicode_ci_password@localhost:5432/sicode_ci"
        run: |
          python -m flask --app run.py db upgrade
          python -m flask --app run.py db current

      - name: Probar backup y restauración real
        run: |
          pg_dump -h localhost -U sicode_ci -d sicode_ci --format=plain --no-owner --no-privileges --file=/tmp/sicode_ci.sql
          test -s /tmp/sicode_ci.sql
          grep -q "PostgreSQL database dump" /tmp/sicode_ci.sql
          createdb -h localhost -U sicode_ci sicode_restore_ci
          psql -h localhost -U sicode_ci -d sicode_restore_ci --set ON_ERROR_STOP=on --file=/tmp/sicode_ci.sql >/dev/null
          psql -h localhost -U sicode_ci -d sicode_restore_ci --set ON_ERROR_STOP=on --command="SELECT COUNT(*) FROM expedientes; SELECT COUNT(*) FROM registros_coordinacion; SELECT COUNT(*) FROM bitacora;" >/dev/null
