name: Validar Auditoria

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:////tmp/sicode_auditoria_test.db"
      SECRET_KEY: "ci-sicode-auditoria-segura"
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar Python
        run: python -m compileall -q app migrations tests

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Validar migraciones
        run: python -m flask --app run.py db heads
